<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐥吃药📅</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f9;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #4CAF50;
    }
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .day {
      padding: 10px;
      text-align: center;
      border: 1px solid #ddd;
      background-color: #fff;
      cursor: pointer;
      transition: background-color 0.3s;
      user-select: none; /* 禁用文本选择 */
    }
    .day:hover {
      background-color: #f1f1f1;
    }
    .taken {
      background-color: #4CAF50;
      color: white;
    }
    .missed {
      background-color: #f44336;
      color: white;
    }
    .selected {
      border: 2px solid #2196F3;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .controls button {
      padding: 10px 20px;
      border: none;
      background-color: #2196F3;
      color: white;
      cursor: pointer;
      border-radius: 5px;
      transition: background-color 0.3s;
    }
    .controls button:hover {
      background-color: #1976D2;
    }
    .encouragement {
      text-align: center;
      font-size: 1.2em;
      color: #4CAF50;
      margin-bottom: 20px;
    }
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>🐥吃药📅</h1>
  <div class="controls">
    <button id="prevMonthBtn">上个月</button>
    <button id="nextMonthBtn">下个月</button>
  </div>
  <div class="weekdays">
    <div>周一</div>
    <div>周二</div>
    <div>周三</div>
    <div>周四</div>
    <div>周五</div>
    <div>周六</div>
    <div>周日</div>
  </div>
  <div class="calendar" id="calendar"></div>
  <div class="controls">
    <button id="confirmBtn">已服药</button>
    <button id="missBtn">未服药</button>
    <button id="clearBtn">清除状态</button>
  </div>
  <div class="encouragement" id="encouragement"></div>
  <script>
    let records = JSON.parse(localStorage.getItem('medRecords')) || {};
    let currentDate = new Date();
    let selectedDates = [];

    // 渲染指定月份的日历
    function renderCalendar(year, month) {
      const calendar = document.getElementById('calendar');
      calendar.innerHTML = '';
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();
      const startDayOfWeek = (firstDay.getDay() === 0) ? 6 : firstDay.getDay() - 1; // 周一到周日排布
      // 创建空白格子
      for (let i = 0; i < startDayOfWeek; i++) {
        const emptyDay = document.createElement('div');
        emptyDay.classList.add('day');
        calendar.appendChild(emptyDay);
      }
      // 创建日期格子
      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayDiv = document.createElement('div');
        dayDiv.classList.add('day');
        dayDiv.textContent = day;
        // 根据记录设置状态
        if (records[dateStr] === true) {
          dayDiv.classList.add('taken');
        } else if (records[dateStr] === false) {
          dayDiv.classList.add('missed');
        }
        // 添加点击事件
        dayDiv.addEventListener('click', (e) => {
          if (e.shiftKey) {
            if (selectedDates.includes(dateStr)) {
              selectedDates = selectedDates.filter(d => d !== dateStr);
              dayDiv.classList.remove('selected');
            } else {
              selectedDates.push(dateStr);
              dayDiv.classList.add('selected');
            }
          } else {
            selectedDates = [dateStr];
            document.querySelectorAll('.day.selected').forEach(d => d.classList.remove('selected'));
            dayDiv.classList.add('selected');
          }
        });
        calendar.appendChild(dayDiv);
      }
      updateEncouragement();
    }

    // 记录状态（已服药或未服药）
    function recordStatus(taken, dates) {
      dates.forEach(date => {
        records[date] = taken;
      });
      localStorage.setItem('medRecords', JSON.stringify(records));
      renderCalendar(currentDate.getFullYear(), currentDate.getMonth());
      selectedDates = [];
    }

    // 清除状态
    function clearStatus(dates) {
      dates.forEach(date => {
        delete records[date];
      });
      localStorage.setItem('medRecords', JSON.stringify(records));
      renderCalendar(currentDate.getFullYear(), currentDate.getMonth());
      selectedDates = [];
    }

    // 更新鼓励栏
    function updateEncouragement() {
      const encouragement = document.getElementById('encouragement');
      const takenDays = Object.values(records).filter(val => val === true).length;
      const missedDays = Object.values(records).filter(val => val === false).length;
      if (takenDays === 0 && missedDays === 0) {
        encouragement.textContent = '开始记录你的服药情况吧！';
      } else {
        encouragement.textContent = `你已经坚持了 ${takenDays} 天，忘记 ${missedDays} 天。加油！`;
      }
    }

    // 切换月份
    function changeMonth(offset) {
      currentDate.setMonth(currentDate.getMonth() + offset);
      renderCalendar(currentDate.getFullYear(), currentDate.getMonth());
    }

    // 初始化事件监听器
    function initEventListeners() {
      document.getElementById('confirmBtn').addEventListener('click', () => recordStatus(true, selectedDates));
      document.getElementById('missBtn').addEventListener('click', () => recordStatus(false, selectedDates));
      document.getElementById('clearBtn').addEventListener('click', () => clearStatus(selectedDates));
      document.getElementById('prevMonthBtn').addEventListener('click', () => changeMonth(-1));
      document.getElementById('nextMonthBtn').addEventListener('click', () => changeMonth(1));
    }

    // 页面加载时初始化
    window.onload = () => {
      renderCalendar(currentDate.getFullYear(), currentDate.getMonth());
      initEventListeners();
    };
  </script>
</body>
</html>
